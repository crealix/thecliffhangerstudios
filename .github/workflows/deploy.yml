name: Deploy GitHub Pages (Develop Branch)

on:
  push:
    branches:
      - develop-main

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Prepare site folder (exclude images)
      - name: Prepare site files
        run: |
          mkdir -p site/thehappyclub
          rsync -av --exclude 'images/' ./thehappyclub/ ./site/thehappyclub/

      # 3️⃣ Upload site artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/thehappyclub/

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

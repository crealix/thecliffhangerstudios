name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # BUILD STEP (EXCLUDE IMAGES)
      # ------------------------------------------
      - name: Build site (exclude images)
        run: |
          mkdir build
          rsync -av \
            --exclude '.git/' \
            --exclude='.github/' \
            --exclude 'thehappyclub/images/' \
            . build

      # ------------------------------------------
      # PREPARE DEPLOY DIRECTORY
      # ------------------------------------------
      - name: Prepare site files (include images)
        run: |
          mkdir site
          rsync -av build/ site/
          mkdir -p site/thehappyclub/images/
          rsync -av thehappyclub/images/ site/thehappyclub/images/

      # ------------------------------------------
      # DEPLOY TO GITHUB PAGES BRANCH
      # ------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

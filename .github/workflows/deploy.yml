name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build (exclude heavy folders)
        run: |
          mkdir site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='thehappyclub/images' \
            ./ site/

      - name: Add images
        run: |
          rsync -av thehappyclub/images/ site/thehappyclub/images/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

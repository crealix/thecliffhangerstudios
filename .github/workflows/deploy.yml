name: Deploy GitHub Pages (Develop Branch)

on:
  push:
    branches:
      - develop-main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p site/thehappyclub
          rsync -av --exclude 'images/' ./thehappyclub/ ./site/thehappyclub/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/thehappyclub/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare site (exclude images + .git)
        run: |
          mkdir site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='thehappyclub/images' \
            ./ site/

      - name: Deploy pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4

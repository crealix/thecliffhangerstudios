name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop-main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare site folder
        run: |
          mkdir site
          shopt -s dotglob
          for item in *; do
            if [ "$item" != "site" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              cp -R "$item" site/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

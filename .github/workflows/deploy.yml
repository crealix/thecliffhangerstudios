name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site files (exclude images & .git)
        run: |
          mkdir site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='thehappyclub/images/' \
            ./ ./site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

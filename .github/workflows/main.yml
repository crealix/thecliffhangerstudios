name: Dynamic Deploy to GitHub Pages

on:
  push:
    # ✅ Auto-detect GitHub Pages branch from repository settings
    branches: 
      - ${{ github.event.repository.pages.source.branch }}

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ✅ Uses the same folder you set in GitHub Pages settings
          path: ${{ github.event.repository.pages.source.path }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

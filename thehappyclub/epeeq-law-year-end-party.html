<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="The Happy Club website">
  <meta name="author" content="The Happy Club">
  <meta name="robots" content="index,follow">
  <meta property="og:url" content="{{url()->current()}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logomainthehappyclub.jpg">
  <meta property="og:site_name" content="The Happy Club" >
  <meta property="og:image:width" content="1200" >
  <meta property="og:image:height" content="630" >
  <meta property="og:title" content="The Happy Club" >
  <title>EPEEQ Law Christmas Party 2024</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="js/disable-right-click.js" defer></script>
</head>
<body>
  <main-epeeqlawyep>
    <section class="wedding-header">
      <p class="top-header-small">Experience happiness at</p>
      <div class="brand-title">
        <a href="index.html"><img src="images/tch_banner_name_title.png" alt="The Happy Club" class="brand-logo"></a><br>
      </div>
    </section>
    <section class="hero">
      <img src="images/20241212EPEEQLawYEP/banner.png"alt="Banner" class="hero-img">
    </section>

    <section class="container tabs-section">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="prints" role="tab" aria-selected="true">Prints</button>
        <button class="tab-btn" data-tab="solo" role="tab" aria-selected="false">Solo</button>
        <button class="tab-btn" data-tab="gif" role="tab" aria-selected="false">GIF</button>
      </div>

      <div id="galleryArea" class="gallery-area">
        <!-- content generated by JS -->
        <div id="galleryGrid" class="gallery-grid"></div>
        <div id="galleryLoading" class="loading">Loading...</div>
      </div>
    </section>
  </main-epeeqlawyep>

  <footer class="site-footer">
    <div class="footer-container">
      <!-- Column 1 -->
      <div class="footer-col">
        <p class="footer-email">📧 thehappyclub.biz@gmail.com</p>
      </div>

      <!-- Column 2 -->
      <div class="footer-col footer-social">
        <a href="https://www.facebook.com/thehappyclub" target="_blank" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.instagram.com/cliffhangerstudios.ph/" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@thecliffhangerstudios" target="_blank" aria-label="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@TheCliffhangerStudios/" target="_blank" aria-label="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>

      <!-- Column 3 -->
      <div class="footer-col">
        <p class="footer-copy">© <span id="year2"></span> The Happy Club</p>
      </div>
    </div>
  </footer>


  <!-- Image Lightbox Modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog">
    <button id="lbClose" class="lb-close" aria-label="Close (Esc)">✕</button>
    <button id="lbShare" class="lb-share" title="Share">🔗</button>
    <button id="lbDownload" class="lb-download" title="Download">⬇</button>
    <button id="lbPrev" class="lb-prev" aria-label="Previous (Left)">‹</button>
    <button id="lbNext" class="lb-next" aria-label="Next (Right)">›</button>
    <div class="lb-content">
      <img id="lbImage" src="" alt="">
      <video id="lbVideo" controls style="display:none;max-height:80vh"></video>
      <div id="lbCaption" class="lb-caption"></div>
    </div>
  </div>

  <!-- Download Request Modal -->
  <div id="downloadModal" class="modal" aria-hidden="true" role="dialog">
    <div class="modal-panel">
      <button id="dmClose" class="dm-close" aria-label="Close">✕</button>
      <h3>DOWNLOAD PHOTOS</h3>
      <p>Your email will be used to notify you when the files are ready for download.</p>
      <input id="dmEmail" type="email" placeholder="Your email" />
      <div class="modal-actions">
        <button id="dmSubmit" class="btn">Request Download</button>
      </div>
      <div id="dmMsg" class="small muted"></div>
    </div>
  </div>

  <script src="js/main-epeeqlawyep.js"></script>
  <script>
    document.getElementById('year2').textContent = new Date().getFullYear();
    window.addEventListener('DOMContentLoaded', () => {
      window.app && window.app.initEvent && window.app.initEvent();
    });
  </script>
</body>
</html>
